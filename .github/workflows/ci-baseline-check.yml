name: Baseline regression check

on:
  pull_request:
    paths:
      - "HPFC/**"
      - "tests/**"
      - "tests/baselines/**"
      - "requirements-dev.txt"
      - ".github/workflows/ci-baseline-check.yml"
  push:
    branches:
      - main
    paths:
      - "HPFC/**"
      - "tests/**"
      - "tests/baselines/**"
      - "requirements-dev.txt"
      - ".github/workflows/ci-baseline-check.yml"

jobs:
  baseline-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run baseline regression tests
        run: python -m pytest tests/test_baselines_check.py